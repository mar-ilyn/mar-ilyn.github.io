    <!-- Pantalla de carga de la galería: la fachada de un museo, plana (SVG en línea), con un filtro oscuro y
         una llave antigua que se vuelve dorada de abajo hacia arriba con el progreso real. Al terminar se quita
         el filtro, se abre la puerta y la vista entra a la sala. CSS crítico en línea, para que se vea antes que
         el JavaScript; el progreso lo pasa src/lib/loader.ts (--p, de 0 a 1). -->
    <script>
      ;(function () {
        var l = location
        if (!/\/lista\/?$/.test(l.pathname) && !/[?&]render=/.test(l.search)) document.documentElement.classList.add('has-loader')
      })()
    </script>
    <style>
      .loader {
        --p: 0;
        --ink: #efe2c9;
        display: none;
        position: fixed;
        inset: 0;
        z-index: 50;
        overflow: hidden;
        color: var(--ink);
        font-family: 'EB Garamond Variable', 'EB Garamond', Garamond, Georgia, serif;
      }
      .has-loader .loader {
        display: block;
      }
      .has-loader body {
        overflow: hidden;
      }
      .has-loader .loader.loader--done {
        display: none;
      }
      /* La fachada cubre la pantalla; el hueco de la puerta es transparente (al abrirse se ve la sala). */
      .loader__scene {
        position: absolute;
        inset: 0;
        transform-origin: 50% 52%;
        transition:
          transform 0.9s cubic-bezier(0.55, 0, 0.8, 0.4) 1.25s,
          opacity 0.5s ease 1.65s;
      }
      .loader__facade {
        width: 100%;
        height: 100%;
      }
      .loader__fanlight-glow {
        opacity: calc(var(--p) * 0.85);
        transition: opacity 0.4s ease;
      }
      .loader__leaf {
        transform-box: fill-box;
        transition:
          transform 0.95s cubic-bezier(0.5, 0, 0.3, 1) 0.4s,
          filter 0.95s ease 0.4s;
      }
      .loader__leaf--l {
        transform-origin: left center;
      }
      .loader__leaf--r {
        transform-origin: right center;
      }
      /* Filtro oscuro sobre la fachada mientras carga. */
      .loader__shade {
        position: absolute;
        inset: 0;
        background: rgb(14 10 8 / 0.74);
        transition: opacity 0.5s ease;
      }
      .loader__front {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 0.6rem;
        padding: 16px;
        text-align: center;
        transition: opacity 0.3s ease;
      }
      /* La llave: una base apagada y encima la dorada, recortada de abajo hacia arriba según el progreso. */
      .loader__key {
        position: relative;
        width: clamp(56px, 9vh, 84px);
        aspect-ratio: 80 / 200;
      }
      .loader__key svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .loader__key-gold {
        clip-path: inset(calc((1 - var(--p)) * 100%) 0 0 0);
        filter: drop-shadow(0 0 calc(var(--p) * 10px) rgb(240 190 100 / 0.45));
        transition: clip-path 0.35s ease;
      }
      .loader__status {
        margin: 0.4rem 0 0;
        font-size: 0.82rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #d8c6a4;
      }
      .loader__sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .loader__bottom {
        position: absolute;
        left: 0;
        right: 0;
        bottom: max(16px, env(safe-area-inset-bottom));
        display: grid;
        justify-items: center;
        gap: 0.5rem;
        padding: 0 16px;
        transition: opacity 0.3s ease;
      }
      .loader__links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.5rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .loader a,
      .loader button {
        font: inherit;
        color: var(--ink);
      }
      .loader__links a,
      .loader__enter {
        display: inline-flex;
        align-items: center;
        min-height: 38px;
        padding: 0 1rem;
        border: 1px solid rgb(239 226 201 / 0.45);
        border-radius: 999px;
        background: rgb(20 14 10 / 0.35);
        font-size: 0.92rem;
        text-decoration: none;
        cursor: pointer;
      }
      .loader__links a:hover {
        background: rgb(255 240 215 / 0.12);
      }
      .loader__list {
        font-size: 0.95rem;
        text-underline-offset: 4px;
        text-decoration-color: rgb(239 226 201 / 0.55);
      }
      .loader--slow .loader__list {
        padding: 0.3rem 0.9rem;
        border-radius: 999px;
        background: rgb(255 240 215 / 0.14);
      }
      .loader a:focus-visible,
      .loader button:focus-visible {
        outline: 2px solid #f1c27d;
        outline-offset: 3px;
      }
      /* Mientras se abre la puerta, abajo: permite saltear la apertura. */
      .loader .loader__enter {
        position: absolute;
        left: 50%;
        bottom: max(24px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        background: var(--ink);
        color: #2a1d15;
        font-size: 0.82rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .loader__enter[hidden] {
        display: none;
      }
      /* Al terminar: se va el filtro, se abren las hojas y la vista entra por la puerta. */
      .loader--open {
        pointer-events: none;
      }
      .loader--open .loader__enter {
        pointer-events: auto;
      }
      .loader--open .loader__shade,
      .loader--open .loader__front,
      .loader--open .loader__bottom {
        opacity: 0;
      }
      .loader--open .loader__leaf--l,
      .loader--open .loader__leaf--r {
        transform: scaleX(0.06);
        filter: brightness(0.55);
      }
      .loader--open .loader__scene {
        transform: scale(3.2);
        opacity: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        .loader *,
        .loader *::before {
          transition: none !important;
        }
      }
    </style>
